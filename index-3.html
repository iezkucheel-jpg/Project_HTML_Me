<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tahsin Al-Qur'an Interaktif</title>
<style>
:root{
  --navy:#17324d;
  --blue:#2e6f95;
  --cream:#fffaf1;
  --gold:#e3b85b;
  --green:#275d4b;
  --green2:#3c7b62;
  --floor:#d8b384;
  --white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--navy);background:#dfe9e3}
button,input{font:inherit}
button{border:0;cursor:pointer}

/* =========================================================
   KONSEP BARU: "RUANG BELAJAR DIGITAL"
   Tidak memakai gambar background kelas dari internet.
   ========================================================= */
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#dfe9e3}
#room{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#edf4ed 0 69%,var(--floor) 69% 100%)}
#room:before{content:"";position:absolute;left:0;right:0;top:69%;height:2px;background:rgba(101,72,44,.18);box-shadow:0 10px 0 rgba(255,255,255,.16)}
#room:after{content:"";position:absolute;left:0;right:0;bottom:0;height:31%;background:repeating-linear-gradient(168deg,transparent 0 74px,rgba(122,84,48,.10) 75px 78px);pointer-events:none}

/* Papan menjadi pusat visual */
#boardFrame{position:absolute;left:50%;top:12%;width:min(82vw,720px);height:min(55vh,520px);transform:translateX(-50%);background:#76583c;padding:13px;border-radius:15px;box-shadow:0 18px 40px rgba(41,49,43,.25);transition:transform 1.2s cubic-bezier(.2,.8,.2,1),width 1.2s,height 1.2s,top 1.2s}
#boardSurface{width:100%;height:100%;border:8px solid #4d745f;border-radius:7px;background:linear-gradient(145deg,#4d8067,#285541);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),inset 0 0 45px rgba(0,0,0,.12);position:relative;overflow:hidden}
#boardSurface:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 25%,rgba(255,255,255,.05),transparent 24%),radial-gradient(circle at 80% 70%,rgba(0,0,0,.08),transparent 30%);pointer-events:none}
#boardHeader{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:rgba(10,35,25,.45);color:#f7f2d7;font-size:clamp(.65rem,2vw,.85rem);font-weight:800;letter-spacing:.04em;white-space:nowrap;z-index:3}

#scene{position:absolute;inset:0;z-index:5;transform-origin:50% 45%;transition:transform 1.25s cubic-bezier(.2,.8,.2,1)}
#scene.focus{transform:scale(1.48)}

/* Jilid benar-benar berada di dalam bidang papan */
#boardMaterial{position:absolute;left:50%;top:40%;width:min(25vw,235px);transform:translate(-50%,-50%);z-index:4;border:7px solid #76583c;border-radius:5px;background:#fff;box-shadow:0 7px 18px rgba(0,0,0,.24);overflow:hidden;transition:transform 1.15s cubic-bezier(.2,.8,.2,1),box-shadow .8s,width 1.15s}
#boardMaterial img{display:block;width:100%;height:auto}
#boardTitle{position:absolute;left:50%;bottom:-38px;transform:translateX(-50%);color:#fff;font-weight:900;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;white-space:nowrap;font-size:clamp(.65rem,2vw,.9rem);opacity:0;transition:opacity .4s}
#scene.focus #boardMaterial{transform:translate(-50%,-50%) scale(1.42);box-shadow:0 18px 45px rgba(0,0,0,.4)}
#scene.focus #boardTitle{opacity:1}

/* Avatar: seperti pengajar berada di depan kelas, bukan menempel pada jilid */
#teachers{position:absolute;inset:0;pointer-events:none;z-index:8}
.teacher{position:absolute;object-fit:contain;height:auto;width:auto;filter:drop-shadow(0 14px 12px rgba(0,0,0,.24));transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .7s,filter .5s}
#ustadzah{left:1%;bottom:3%;height:min(47vh,500px);opacity:.78;z-index:7;transform-origin:bottom center}
#ustad{right:0%;bottom:1%;height:min(60vh,640px);z-index:9;transform-origin:bottom center}
.teacher.speaking{animation:breathe .9s ease-in-out infinite alternate;filter:drop-shadow(0 12px 12px rgba(0,0,0,.25)) drop-shadow(0 0 12px rgba(255,226,120,.65))}
#ustad.instruction{transform:translateX(-7%) rotate(-1deg)}
#ustadzah.instruction{transform:translateX(-2%)}
#scene.focus #ustadzah{transform:translateX(-13%) scale(.64);opacity:.14}
#scene.focus #ustad{transform:translateX(12%) scale(.64);opacity:.14}

/* Nama dan status */
#greeting{position:absolute;top:4.5%;left:50%;transform:translateX(-50%);z-index:20;width:min(92vw,760px);text-align:center;color:var(--navy);font-size:clamp(1rem,3.8vw,1.8rem);font-weight:900;opacity:0;transition:opacity .7s;text-shadow:0 2px 0 rgba(255,255,255,.8)}
#greeting.show{opacity:1}
#status{position:absolute;top:calc(4.5% + 42px);left:50%;transform:translateX(-50%);z-index:25;background:rgba(255,255,255,.88);border:1px solid rgba(23,50,77,.1);color:var(--navy);padding:7px 13px;border-radius:999px;font-size:.75rem;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.12);white-space:nowrap}

/* Caption hanya berupa instruksi yang relevan */
#caption{position:absolute;left:50%;bottom:4.5%;transform:translateX(-50%);z-index:30;width:min(88vw,620px);padding:13px 17px;border-radius:18px;background:rgba(255,255,255,.94);box-shadow:0 12px 28px rgba(0,0,0,.16);font-size:clamp(.82rem,2.5vw,1rem);line-height:1.42;text-align:center;opacity:0;transition:opacity .5s}
#caption.show{opacity:1}
#boardHint{position:absolute;left:50%;top:calc(40% + 130px);transform:translateX(-50%);z-index:15;color:#fff;background:rgba(15,40,30,.72);padding:8px 13px;border-radius:999px;font-size:.75rem;opacity:0;transition:opacity .5s;white-space:nowrap}
#boardHint.show{opacity:1}

/* Layar awal */
#nameOverlay{position:absolute;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(23,50,77,.20);backdrop-filter:blur(8px);transition:opacity .7s,visibility .7s}
#nameOverlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.nameCard{width:min(90vw,430px);padding:27px;border-radius:26px;background:rgba(255,255,255,.97);box-shadow:0 25px 65px rgba(0,0,0,.24);text-align:center}
.nameCard .logo{width:64px;height:64px;margin:0 auto 10px;border-radius:18px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:30px;box-shadow:0 8px 18px rgba(39,93,75,.25)}
.nameCard h1{margin:0 0 7px;font-size:clamp(1.35rem,5vw,2rem)}
.nameCard p{margin:0 0 18px;color:#63717b;font-size:.92rem;line-height:1.4}
.nameCard input{width:100%;padding:14px 15px;border:2px solid #e1e7ea;border-radius:14px;outline:none;background:#fff}
.nameCard input:focus{border-color:#6c9db7}
.start{margin-top:13px;width:100%;padding:14px;border-radius:14px;background:var(--blue);color:#fff;font-weight:900;box-shadow:0 8px 16px rgba(46,111,149,.2);transition:transform .15s,opacity .2s}
.start:not(:disabled):active{transform:scale(.98)}
.start:disabled{opacity:.4;cursor:not-allowed}

/* Setelah penutup: mode membaca */
#afterLesson{position:absolute;inset:0;z-index:60;display:none;pointer-events:none;background:rgba(23,50,77,.06)}
#afterLesson.show{display:block}
#touchCard{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(31vw,250px);min-width:170px;padding:0;background:transparent;border:0;border-radius:10px;pointer-events:auto;transition:transform .9s cubic-bezier(.2,.8,.2,1),width .9s,top .9s;cursor:pointer}
#touchCard img{display:block;width:100%;height:auto;border:7px solid #76583c;border-radius:5px;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.28)}
#touchLabel{position:absolute;left:50%;top:-56px;transform:translateX(-50%);padding:10px 14px;border-radius:999px;background:#fff;color:var(--navy);font-weight:900;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.17);font-size:.85rem}
#afterLesson.zoomed{background:rgba(15,33,45,.88);backdrop-filter:blur(2px)}
#afterLesson.zoomed #touchCard{top:45%;width:min(88vw,650px);transform:translate(-50%,-50%)}
#afterLesson.zoomed #touchCard img{box-shadow:0 20px 55px rgba(0,0,0,.48)}
#afterLesson.zoomed #touchLabel{background:var(--gold);color:#3c2d13}
#recordBox{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;pointer-events:auto;opacity:0;transition:opacity .45s;width:max-content;max-width:92vw}
#afterLesson.zoomed #recordBox{opacity:1}
#recordBtn{width:64px;height:64px;border-radius:50%;background:#c83b3b;color:#fff;box-shadow:0 10px 25px rgba(0,0,0,.28);font-size:28px;transition:transform .15s}
#recordBtn:active{transform:scale(.92)}
#recordBtn.recording{background:#25815d;animation:pulse 1s infinite}
#recordMsg{background:#fff;padding:10px 13px;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.18);font-weight:800;font-size:.78rem}
#recordedAudio{display:none;position:absolute;left:50%;bottom:1%;transform:translateX(-50%);z-index:80;width:min(90vw,500px)}

@keyframes breathe{from{transform:translateY(0) scale(1)}to{transform:translateY(-5px) scale(1.01)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,129,93,.35)}50%{box-shadow:0 0 0 15px rgba(37,129,93,0)}}

@media(max-width:700px){
  #boardFrame{top:14%;width:88vw;height:45vh;padding:9px;border-radius:12px}
  #boardSurface{border-width:6px}
  #boardHeader{top:8px;font-size:.6rem}
  #boardMaterial{top:43%;width:30vw;max-width:190px;border-width:5px}
  #scene.focus{transform:scale(1.35)}
  #scene.focus #boardMaterial{transform:translate(-50%,-50%) scale(1.32)}
  #ustadzah{left:-9%;bottom:2%;height:39vh;opacity:.65}
  #ustad{right:-8%;bottom:0;height:51vh}
  #boardHint{top:58%;font-size:.68rem}
  #caption{bottom:2.5%;width:91vw}
  #status{top:calc(4.5% + 38px);font-size:.68rem}
  #greeting{top:3.3%}
  #afterLesson.zoomed #touchCard{width:89vw;top:42%}
}

@media(min-width:701px){
  #ustadzah{left:4%}
  #ustad{right:4%}
}
</style>
</head>
<body>
<div id="app">
  <div id="room">
    <div id="boardFrame">
      <div id="boardSurface">
        <div id="boardHeader">TAHSIN AL-QUR'AN • JILID 3</div>
      </div>
    </div>
  </div>

  <div id="scene">
    <div id="greeting"></div>
    <div id="teachers">
      <!-- Nama file dibuat mengikuti file PNG asli yang umum dipakai di proyek Anda. -->
      <img id="ustadzah" class="teacher" src="gambar_ustadzah.png" alt="Ustadzah">
      <img id="ustad" class="teacher" src="gambar_ustad.png" alt="Ustadz">
    </div>

    <div id="boardMaterial">
      <img src="materi_jilid.jpg" alt="Materi IWR Jilid 3 halaman 2">
      <div id="boardTitle">Bacaan mim yang ditahan dengungnya</div>
    </div>
    <div id="boardHint">Perhatikan materi di papan tulis</div>
    <div id="caption"></div>
  </div>

  <div id="status">Siap belajar</div>

  <div id="nameOverlay">
    <form class="nameCard" id="nameForm">
      <div class="logo">📖</div>
      <h1>Tahsin Al-Qur'an</h1>
      <p>Selamat datang. Masukkan nama lengkap siswa untuk memulai pembelajaran.</p>
      <input id="studentName" autocomplete="name" placeholder="Nama Lengkap Siswa" minlength="3" required>
      <button class="start" id="startBtn" disabled>Mulai Belajar</button>
    </form>
  </div>

  <div id="afterLesson">
    <div id="touchCard" title="Sentuh materi untuk mendekat">
      <img src="materi_jilid.jpg" alt="Materi jilid">
      <div id="touchLabel">👆 Klik untuk membaca jilid</div>
    </div>
    <div id="recordBox">
      <button id="recordBtn" aria-label="Mulai merekam">🎙️</button>
      <div id="recordMsg">Ketuk mikrofon untuk merekam</div>
    </div>
  </div>

  <!-- STRUKTUR AUDIO TETAP -->
  <audio id="a1" preload="auto" src="audio_1_salam.m4a"></audio>
  <audio id="a2" preload="auto" src="audio_2_instruksi.m4a"></audio>
  <audio id="a3" preload="auto" src="audio_3_materi.m4a"></audio>
  <audio id="a4" preload="auto" src="audio_4_penutup.m4a"></audio>
  <audio id="recordedAudio" controls></audio>
</div>

<script>
/* =========================================================
   LOGIC ASLI DIPERTAHANKAN: audio berurutan memakai ended,
   MediaRecorder tetap sama, dan hook Apps Script tetap ada.
   ========================================================= */
const audios = [
  document.getElementById('a1'),
  document.getElementById('a2'),
  document.getElementById('a3'),
  document.getElementById('a4')
];

const captions = [
  "Assalamu'alaikum. Selamat datang, anak-anak.",
  "Perhatikan ustadz. Dengarkan cara membaca jilid dan cara merekam bacaan dengan baik.",
  "Perhatikan contoh pada jilid. Bacaan mim yang bertemu mim bertasydid dibaca dengan dengung.",
  "Alhamdulillah. Terus semangat belajar dan ulangi latihan membaca Al-Qur'an dengan baik."
];

const nameOverlay = document.getElementById('nameOverlay');
const nameForm = document.getElementById('nameForm');
const studentName = document.getElementById('studentName');
const startBtn = document.getElementById('startBtn');
const scene = document.getElementById('scene');
const greeting = document.getElementById('greeting');
const caption = document.getElementById('caption');
const status = document.getElementById('status');
const ustad = document.getElementById('ustad');
const ustadzah = document.getElementById('ustadzah');
const boardHint = document.getElementById('boardHint');
const afterLesson = document.getElementById('afterLesson');
const touchCard = document.getElementById('touchCard');
const recordBtn = document.getElementById('recordBtn');
const recordMsg = document.getElementById('recordMsg');
const recordedAudio = document.getElementById('recordedAudio');

let index = 0;
let namaSiswa = '';
let recorder = null;
let chunks = [];

studentName.addEventListener('input', () => {
  startBtn.disabled = studentName.value.trim().length < 3;
});

nameForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  namaSiswa = studentName.value.trim();
  nameOverlay.classList.add('hidden');
  greeting.textContent = `Selamat belajar, ${namaSiswa}!`;
  setTimeout(() => greeting.classList.add('show'), 450);
  status.textContent = 'Pembukaan';
  await startAudio(0);
});

function setSpeaking(on) {
  ustad.classList.toggle('speaking', on);
}

async function startAudio(i) {
  index = i;
  if (i >= audios.length) {
    finishLesson();
    return;
  }

  audios.forEach((a,j) => {
    if (j !== i) { a.pause(); a.currentTime = 0; }
    a.volume = 1.0;
  });

  setSpeaking(true);
  caption.classList.remove('show');

  if (i === 1) {
    caption.textContent = '📖 Perhatikan ustadz. Dengarkan instruksi cara membaca jilid dan cara merekam bacaan.';
    caption.classList.add('show');
  } else if (i === 2) {
    caption.textContent = '🔎 Fokus ke jilid. Bacalah contoh dengan teliti sesuai penjelasan ustadz.';
    caption.classList.add('show');
  }

  if (i === 0) {
    scene.classList.remove('focus');
    ustad.classList.remove('instruction');
    ustadzah.classList.remove('instruction');
    boardHint.classList.remove('show');
    status.textContent = 'Ustadz: salam dan sapaan';
  } else if (i === 1) {
    ustad.classList.add('instruction');
    ustadzah.classList.add('instruction');
    status.textContent = 'Ustadz: memberikan instruksi';
  } else if (i === 2) {
    scene.classList.add('focus');
    boardHint.classList.add('show');
    status.textContent = 'Materi: mim bertemu mim bertasydid';
  } else if (i === 3) {
    scene.classList.remove('focus');
    boardHint.classList.remove('show');
    ustad.classList.remove('instruction');
    ustadzah.classList.remove('instruction');
    status.textContent = 'Ustadz: motivasi dan penutup';
  }

  try {
    await audios[i].play();
  } catch(err) {
    status.textContent = 'Tekan Mulai Belajar untuk mengaktifkan suara.';
    setSpeaking(false);
    console.warn(err);
  }
}

audios.forEach((audio, i) => {
  audio.addEventListener('ended', () => {
    if (i === index) startAudio(i + 1);
  });
});

function finishLesson() {
  setSpeaking(false);
  caption.classList.remove('show');
  status.textContent = 'Sekarang giliran siswa';
  afterLesson.classList.add('show');
  scene.classList.remove('focus');
  greeting.classList.add('show');
}

touchCard.addEventListener('click', () => {
  afterLesson.classList.add('zoomed');
  recordMsg.textContent = 'Ketuk mikrofon untuk merekam';
});

recordBtn.addEventListener('click', async () => {
  if (recorder && recorder.state === 'recording') {
    recorder.stop();
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    recordMsg.textContent = 'Browser ini tidak mendukung perekaman suara.';
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstart = () => {
      recordBtn.classList.add('recording');
      recordBtn.textContent = '⏹️';
      recordMsg.textContent = 'Sedang merekam... ketuk lagi untuk berhenti.';
    };
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, {type:'audio/webm'});
      const url = URL.createObjectURL(blob);
      recordedAudio.src = url;
      recordedAudio.style.display = 'block';
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '🎙️';
      recordMsg.textContent = 'Rekaman selesai. Silakan dengarkan hasilnya.';
    };
    recorder.start();
  } catch(err) {
    recordMsg.textContent = 'Izin mikrofon belum diberikan.';
    console.error(err);
  }
});

// Hook tahap berikutnya: sengaja tidak dipanggil otomatis.
async function kirimDataSiswa(nama, linkAudio) {
  const endpoint = 'https://script.google.com/macros/s/AKfycbz8TWEnHNhHR7RG4HAb72raYQ8u63bZHEMNSaFwfvs6vgve1-0PSO5NDAoQiMmtWnUSJg/exec';
  return fetch(endpoint, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({nama:nama, audio:linkAudio, timestamp:new Date().toISOString()})
  });
}
</script>
</body>
</html>
