<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tahsin Al-Qur'an Interaktif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#17324d;
  --blue:#2e6f95;
  --cream:#fffaf1;
  --gold:#e3b85b;
  --gold2:#c99a3f;
  --green:#275d4b;
  --green2:#3c7b62;
  --floor:#d8b384;
  --wall1:#eef6f0;
  --wall2:#dcebe1;
  --white:#fff;
  --ease:cubic-bezier(.22,.8,.32,1);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--navy);background:#dfe9e3}
h1,.brandFont,#boardHeader,#greeting,#touchLabel,.start{font-family:'Poppins',system-ui,sans-serif}
button,input{font:inherit}
button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}

/* =========================================================
   RUANG BELAJAR DIGITAL — versi halus & lapang
   Tidak memakai gambar background kelas dari internet.
   ========================================================= */
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#dfe9e3}
#room{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--wall1) 0 62%,var(--wall2) 62% 69%,var(--floor) 69% 100%)}
#room:before{content:"";position:absolute;left:0;right:0;top:69%;height:2px;background:rgba(101,72,44,.18);box-shadow:0 10px 0 rgba(255,255,255,.16)}
#room:after{content:"";position:absolute;left:0;right:0;bottom:0;height:31%;background:repeating-linear-gradient(168deg,transparent 0 74px,rgba(122,84,48,.10) 75px 78px);pointer-events:none}
/* cahaya lembut di atas papan, memberi kedalaman ruang tanpa gambar */
#roomLight{position:absolute;left:50%;top:-6%;width:min(70vw,640px);height:46%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 0%,rgba(255,250,230,.55),rgba(255,250,230,0) 70%);pointer-events:none;z-index:1}

/* Papan menjadi pusat visual, kini dengan bingkai & baki kapur agar terbaca jelas */
#boardFrame{position:absolute;left:50%;top:12%;width:min(82vw,720px);height:min(55vh,520px);transform:translateX(-50%) translateY(-14px);opacity:0;background:linear-gradient(160deg,#8a6a48,#6b4f34);padding:14px 14px 26px;border-radius:16px;box-shadow:0 22px 46px rgba(41,49,43,.28),inset 0 1px 0 rgba(255,255,255,.18);transition:transform 1.2s var(--ease),width 1.2s,height 1.2s,top 1.2s;animation:boardIn .9s .15s var(--ease) forwards}
#boardFrame:after{content:"";position:absolute;left:16px;right:16px;bottom:8px;height:10px;border-radius:6px;background:linear-gradient(180deg,#9a7a55,#7a5c3c);box-shadow:inset 0 2px 3px rgba(0,0,0,.25),0 2px 3px rgba(0,0,0,.15)}
#boardSurface{width:100%;height:100%;border:7px solid #4d745f;border-radius:8px;background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 64px),
    linear-gradient(150deg,#4f8369,#22492f);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.14),inset 0 0 55px rgba(0,0,0,.22);position:relative;overflow:hidden}
#boardSurface:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 20%,rgba(255,255,255,.09),transparent 30%),radial-gradient(circle at 82% 78%,rgba(0,0,0,.16),transparent 34%);pointer-events:none}
#boardHeader{position:absolute;top:-14px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:999px;background:linear-gradient(180deg,#f7ecc8,#eddca0);color:#3c2d13;font-size:clamp(.66rem,2vw,.85rem);font-weight:800;letter-spacing:.02em;white-space:nowrap;z-index:6;box-shadow:0 8px 18px rgba(0,0,0,.22),0 0 0 3px rgba(255,255,255,.5) inset}

#scene{position:absolute;inset:0;z-index:5;transform-origin:50% 45%;transition:transform 1.25s var(--ease)}
#scene.focus{transform:scale(1.48)}

/* Jilid benar-benar berada di dalam bidang papan, digantung rapi dengan sedikit ruang napas */
#boardMaterial{position:absolute;left:50%;top:44%;width:min(23vw,220px);transform:translate(-50%,-50%) rotate(-1.2deg);z-index:4;border:7px solid #f2f2f2;border-radius:4px;background:#fff;box-shadow:0 9px 20px rgba(0,0,0,.28);overflow:hidden;opacity:0;transition:transform 1.15s var(--ease),box-shadow .8s,width 1.15s;animation:materialIn .8s .55s var(--ease) forwards}
#boardMaterial:before{content:"";position:absolute;left:50%;top:-9px;transform:translateX(-50%) rotate(2deg);width:46px;height:16px;background:rgba(227,184,91,.85);border-radius:2px;box-shadow:0 3px 5px rgba(0,0,0,.2);z-index:2}
#boardMaterial img{display:block;width:100%;height:auto}
#boardTitle{position:absolute;left:50%;bottom:-40px;transform:translateX(-50%);color:#fff;font-weight:800;background:rgba(15,40,30,.55);padding:5px 12px;border-radius:999px;white-space:nowrap;font-size:clamp(.62rem,2vw,.85rem);opacity:0;transition:opacity .4s}
#scene.focus #boardMaterial{transform:translate(-50%,-50%) scale(1.42) rotate(0deg);box-shadow:0 20px 48px rgba(0,0,0,.42)}
#scene.focus #boardTitle{opacity:1}

/* Guru: berdiri lapang di depan kelas, tidak pernah bertumpuk satu sama lain atau dengan papan */
#teachers{position:absolute;left:0;right:0;bottom:0;height:72%;display:flex;align-items:flex-end;justify-content:space-between;padding:0 clamp(6px,3vw,40px);pointer-events:none;z-index:8}
.teacherWrap{position:relative;display:flex;align-items:flex-end;justify-content:center;height:100%;opacity:0;transform:translateY(22px);transition:transform 1s var(--ease),opacity .8s}
.teacherWrap:before{content:"";position:absolute;bottom:2%;width:60%;height:14px;background:radial-gradient(ellipse,rgba(20,30,25,.28),transparent 72%);filter:blur(1px)}
.teacher{position:relative;display:block;object-fit:contain;height:auto;width:auto;filter:drop-shadow(0 14px 12px rgba(0,0,0,.22));transition:transform 1s var(--ease),opacity .7s,filter .5s;animation:idleSway 5.5s ease-in-out infinite}
#ustadzahWrap{max-width:40%}
#ustadWrap{max-width:52%}
#ustadzah{height:min(46vh,480px);max-height:70vh;opacity:.9;z-index:7;transform-origin:bottom center;animation-delay:.2s}
#ustad{height:min(58vh,610px);max-height:80vh;z-index:9;transform-origin:bottom center}
.room-ready #ustadzahWrap,.room-ready #ustadWrap{opacity:1;transform:translateY(0)}
.teacher.speaking{animation:breathe .9s ease-in-out infinite alternate;filter:drop-shadow(0 12px 12px rgba(0,0,0,.22)) drop-shadow(0 0 16px rgba(255,226,120,.7))}
#ustad.instruction{transform:translateX(-6%) rotate(-1deg)}
#ustadzah.instruction{transform:translateX(3%)}
#scene.focus #ustadzahWrap{transform:translateX(-6%) scale(.62);opacity:.16}
#scene.focus #ustadWrap{transform:translateX(6%) scale(.62);opacity:.16}

/* fallback ramah bila gambar guru belum ditemukan di repositori */
.teacher.img-missing{width:min(30vw,190px);height:auto;aspect-ratio:3/5;border-radius:18px 18px 4px 4px;background:linear-gradient(160deg,#c9d8d0,#a9bdb2);display:flex;align-items:flex-end;justify-content:center;filter:none}
.teacher.img-missing:after{content:attr(data-fallback-label);position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:#3c4a44;font-size:.7rem;font-weight:800;background:rgba(255,255,255,.75);padding:4px 9px;border-radius:999px;white-space:nowrap}

/* Nama dan status: ditumpuk rapi vertikal, tidak pernah saling menabrak */
#topStack{position:absolute;top:calc(4.2% + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;width:min(92vw,760px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#greeting{text-align:center;color:var(--navy);font-size:clamp(1rem,3.6vw,1.7rem);font-weight:800;opacity:0;transform:translateY(-6px);transition:opacity .7s,transform .7s;text-shadow:0 2px 0 rgba(255,255,255,.8)}
#greeting.show{opacity:1;transform:translateY(0)}
#status{background:rgba(255,255,255,.9);border:1px solid rgba(23,50,77,.1);color:var(--navy);padding:7px 14px;border-radius:999px;font-size:.75rem;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.12);white-space:nowrap;transition:opacity .3s}

/* Caption hanya berupa instruksi yang relevan */
#caption{position:absolute;left:50%;bottom:calc(4% + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);z-index:30;width:min(88vw,620px);padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.95);box-shadow:0 14px 30px rgba(0,0,0,.16);font-size:clamp(.82rem,2.5vw,1rem);line-height:1.45;text-align:center;opacity:0;transition:opacity .5s,transform .5s}
#caption.show{opacity:1;transform:translateX(-50%) translateY(0)}
#boardHint{position:absolute;left:50%;top:calc(44% + 118px);transform:translateX(-50%) scale(.9);z-index:15;color:#fff;background:rgba(15,40,30,.75);padding:8px 14px;border-radius:999px;font-size:.75rem;opacity:0;transition:opacity .5s,transform .5s;white-space:nowrap}
#boardHint.show{opacity:1;transform:translateX(-50%) scale(1);animation:hintPulse 1.8s ease-in-out infinite}

/* Layar awal */
#nameOverlay{position:absolute;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(23,50,77,.22);backdrop-filter:blur(9px);transition:opacity .55s,visibility .55s}
#nameOverlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
#nameOverlay.hidden .nameCard{transform:scale(.92) translateY(10px)}
.nameCard{width:min(90vw,430px);padding:30px 27px;border-radius:26px;background:rgba(255,255,255,.98);box-shadow:0 25px 65px rgba(0,0,0,.24);text-align:center;transform:scale(1) translateY(0);transition:transform .55s var(--ease);animation:cardIn .6s var(--ease)}
.nameCard .logo{width:64px;height:64px;margin:0 auto 12px;border-radius:18px;background:linear-gradient(150deg,var(--green2),var(--green));display:grid;place-items:center;color:#fff;font-size:30px;box-shadow:0 8px 18px rgba(39,93,75,.3);animation:logoPop .7s .1s var(--ease) both}
.nameCard h1{margin:0 0 7px;font-size:clamp(1.3rem,5vw,1.9rem);font-weight:800}
.nameCard p{margin:0 0 20px;color:#63717b;font-size:.92rem;line-height:1.45}
.nameCard input{width:100%;padding:14px 16px;border:2px solid #e1e7ea;border-radius:14px;outline:none;background:#fbfcfd;transition:border-color .2s,background .2s}
.nameCard input:focus{border-color:#6c9db7;background:#fff}
.start{margin-top:14px;width:100%;padding:14px;border-radius:14px;background:linear-gradient(150deg,#3a80a8,var(--blue));color:#fff;font-weight:700;box-shadow:0 10px 20px rgba(46,111,149,.25);transition:transform .15s var(--ease),opacity .2s,box-shadow .2s}
.start:not(:disabled):hover{box-shadow:0 12px 24px rgba(46,111,149,.32)}
.start:not(:disabled):active{transform:scale(.97)}
.start:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* Setelah penutup: mode membaca */
#afterLesson{position:absolute;inset:0;z-index:60;display:none;pointer-events:none;background:rgba(23,50,77,.06)}
#afterLesson.show{display:block;animation:fadeIn .5s var(--ease)}
#touchCard{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(30vw,240px);min-width:160px;padding:0;background:transparent;border:0;border-radius:10px;pointer-events:auto;transition:transform .9s var(--ease),width .9s,top .9s;cursor:pointer;animation:cardHover 3.2s ease-in-out infinite}
#touchCard:hover img{box-shadow:0 16px 36px rgba(0,0,0,.34)}
#touchCard img{display:block;width:100%;height:auto;border:7px solid #f2f2f2;border-radius:4px;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.28);transition:box-shadow .3s}
#touchLabel{position:absolute;left:50%;top:-58px;transform:translateX(-50%);padding:10px 15px;border-radius:999px;background:#fff;color:var(--navy);font-weight:700;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.17);font-size:.85rem}
#afterLesson.zoomed{background:rgba(15,33,45,.9);backdrop-filter:blur(3px)}
#afterLesson.zoomed #touchCard{top:44%;width:min(88vw,650px);transform:translate(-50%,-50%);animation:none}
#afterLesson.zoomed #touchCard img{box-shadow:0 20px 55px rgba(0,0,0,.48)}
#afterLesson.zoomed #touchLabel{background:var(--gold);color:#3c2d13}
#recordBox{position:absolute;left:50%;bottom:calc(4% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:11px;pointer-events:auto;opacity:0;transition:opacity .45s .1s,transform .45s .1s;transform:translateX(-50%) translateY(10px);width:max-content;max-width:92vw}
#afterLesson.zoomed #recordBox{opacity:1;transform:translateX(-50%) translateY(0)}
#recordBtn{width:64px;height:64px;border-radius:50%;background:linear-gradient(150deg,#d24c4c,#b93131);color:#fff;box-shadow:0 10px 25px rgba(0,0,0,.28);font-size:28px;transition:transform .15s}
#recordBtn:hover{transform:scale(1.05)}
#recordBtn:active{transform:scale(.92)}
#recordBtn.recording{background:linear-gradient(150deg,#2f9c70,#25815d);animation:pulse 1s infinite}
#recordMsg{background:#fff;padding:10px 14px;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.18);font-weight:700;font-size:.78rem;max-width:52vw}
#recordedAudio{display:none;position:absolute;left:50%;bottom:1%;transform:translateX(-50%);z-index:80;width:min(90vw,500px);border-radius:999px}

@keyframes boardIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes materialIn{to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes logoPop{from{transform:scale(.5) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes idleSway{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(.4deg)}}
@keyframes breathe{from{transform:translateY(0) scale(1)}to{transform:translateY(-5px) scale(1.01)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,129,93,.35)}50%{box-shadow:0 0 0 15px rgba(37,129,93,0)}}
@keyframes hintPulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes cardHover{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-7px)}}

@media(max-width:700px){
  #boardFrame{top:13%;width:90vw;height:42vh;padding:10px 10px 20px;border-radius:13px}
  #boardSurface{border-width:6px}
  #boardHeader{font-size:.62rem;padding:7px 14px}
  #boardMaterial{top:46%;width:32vw;max-width:180px;border-width:5px}
  #scene.focus{transform:scale(1.32)}
  #scene.focus #boardMaterial{transform:translate(-50%,-50%) scale(1.28) rotate(0deg)}
  #teachers{height:66%;padding:0 4px}
  #ustadzahWrap{max-width:36%}
  #ustadWrap{max-width:50%}
  #ustadzah{height:36vh;opacity:.82}
  #ustad{height:47vh}
  #boardHint{top:60%;font-size:.68rem}
  #caption{width:92vw;padding:12px 16px}
  #status{font-size:.68rem}
  #topStack{gap:6px}
  #afterLesson.zoomed #touchCard{width:90vw;top:40%}
  #recordMsg{max-width:60vw;font-size:.72rem}
}

@media(max-width:420px){
  #ustadzahWrap{max-width:32%}
  #ustadWrap{max-width:46%}
  #ustadzah{height:31vh}
  #ustad{height:41vh}
  #boardFrame{width:92vw;height:38vh}
}

@media(min-width:701px){
  #teachers{padding:0 3vw}
}
</style>
</head>
<body>
<div id="app">
  <div id="room">
    <div id="roomLight"></div>
    <div id="boardFrame">
      <div id="boardSurface">
        <div id="boardHeader">TAHSIN AL-QUR'AN • JILID 3</div>
      </div>
    </div>
  </div>

  <div id="scene">
    <div id="teachers">
      <!-- Nama file mengikuti file PNG asli di repositori Anda.
           Jika ustad/ustadzah masih belum tampil, pastikan nama file & huruf besar/kecil
           di baris <img src="..."> ini SAMA PERSIS dengan file di repositori Anda
           (mis. gambar_ustad.png vs Gambar_Ustad.PNG dianggap berbeda oleh browser). -->
      <div class="teacherWrap" id="ustadzahWrap">
        <img id="ustadzah" class="teacher" src="gambar_ustadzah.png" alt="Ustadzah" data-fallback-label="Ustadzah"
             onerror="this.classList.add('img-missing');this.removeAttribute('src')">
      </div>
      <div class="teacherWrap" id="ustadWrap">
        <img id="ustad" class="teacher" src="gambar_ustad.png" alt="Ustadz" data-fallback-label="Ustadz"
             onerror="this.classList.add('img-missing');this.removeAttribute('src')">
      </div>
    </div>

    <div id="boardMaterial">
      <img src="materi_jilid.jpg" alt="Materi IWR Jilid 3 halaman 2"
           onerror="this.parentElement.style.background='linear-gradient(160deg,#eef1e6,#dbe3d3)';this.style.display='none'">
      <div id="boardTitle">Bacaan mim yang ditahan dengungnya</div>
    </div>
    <div id="boardHint">Perhatikan materi di papan tulis</div>
    <div id="caption"></div>
  </div>

  <div id="topStack">
    <div id="greeting"></div>
    <div id="status">Siap belajar</div>
  </div>

  <div id="nameOverlay">
    <form class="nameCard" id="nameForm">
      <div class="logo">📖</div>
      <h1>Tahsin Al-Qur'an</h1>
      <p>Selamat datang. Masukkan nama lengkap siswa untuk memulai pembelajaran.</p>
      <input id="studentName" autocomplete="name" placeholder="Nama Lengkap Siswa" minlength="3" required>
      <button class="start" id="startBtn" disabled>Mulai Belajar</button>
    </form>
  </div>

  <div id="afterLesson">
    <div id="touchCard" title="Sentuh materi untuk mendekat">
      <img src="materi_jilid.jpg" alt="Materi jilid"
           onerror="this.style.display='none'">
      <div id="touchLabel">👆 Klik untuk membaca jilid</div>
    </div>
    <div id="recordBox">
      <button id="recordBtn" aria-label="Mulai merekam">🎙️</button>
      <div id="recordMsg">Ketuk mikrofon untuk merekam</div>
    </div>
  </div>

  <!-- STRUKTUR AUDIO TETAP -->
  <audio id="a1" preload="auto" src="audio_1_salam.m4a"></audio>
  <audio id="a2" preload="auto" src="audio_2_instruksi.m4a"></audio>
  <audio id="a3" preload="auto" src="audio_3_materi.m4a"></audio>
  <audio id="a4" preload="auto" src="audio_4_penutup.m4a"></audio>
  <audio id="recordedAudio" controls></audio>
</div>

<script>
/* =========================================================
   LOGIC ASLI DIPERTAHANKAN: audio berurutan memakai ended,
   MediaRecorder tetap sama, dan hook Apps Script tetap ada.
   ========================================================= */
const audios = [
  document.getElementById('a1'),
  document.getElementById('a2'),
  document.getElementById('a3'),
  document.getElementById('a4')
];

const captions = [
  "Assalamu'alaikum. Selamat datang, anak-anak.",
  "Perhatikan ustadz. Dengarkan cara membaca jilid dan cara merekam bacaan dengan baik.",
  "Perhatikan contoh pada jilid. Bacaan mim yang bertemu mim bertasydid dibaca dengan dengung.",
  "Alhamdulillah. Terus semangat belajar dan ulangi latihan membaca Al-Qur'an dengan baik."
];

const nameOverlay = document.getElementById('nameOverlay');
const nameForm = document.getElementById('nameForm');
const studentName = document.getElementById('studentName');
const startBtn = document.getElementById('startBtn');
const scene = document.getElementById('scene');
const greeting = document.getElementById('greeting');
const caption = document.getElementById('caption');
const status = document.getElementById('status');
const ustad = document.getElementById('ustad');
const ustadzah = document.getElementById('ustadzah');
const boardHint = document.getElementById('boardHint');
const afterLesson = document.getElementById('afterLesson');
const touchCard = document.getElementById('touchCard');
const recordBtn = document.getElementById('recordBtn');
const recordMsg = document.getElementById('recordMsg');
const recordedAudio = document.getElementById('recordedAudio');

let index = 0;
let namaSiswa = '';
let recorder = null;
let chunks = [];

function syncStartBtn() {
  startBtn.disabled = studentName.value.trim().length < 3;
}
studentName.addEventListener('input', syncStartBtn);
studentName.addEventListener('keyup', syncStartBtn);
studentName.addEventListener('change', syncStartBtn);
studentName.addEventListener('blur', syncStartBtn);
// Cadangan: sebagian browser/WebView tidak memicu event saat nama terisi
// otomatis lewat autocomplete, sehingga tombol bisa macet dalam keadaan nonaktif.
setInterval(syncStartBtn, 400);
syncStartBtn();

nameForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  namaSiswa = studentName.value.trim();
  nameOverlay.classList.add('hidden');
  greeting.textContent = `Selamat belajar, ${namaSiswa}!`;
  setTimeout(() => greeting.classList.add('show'), 450);
  status.textContent = 'Pembukaan';
  await startAudio(0);
});

function setSpeaking(on) {
  ustad.classList.toggle('speaking', on);
}

async function startAudio(i) {
  index = i;
  if (i >= audios.length) {
    finishLesson();
    return;
  }

  audios.forEach((a,j) => {
    if (j !== i) { a.pause(); a.currentTime = 0; }
    a.volume = 1.0;
  });

  setSpeaking(true);
  caption.classList.remove('show');

  if (i === 1) {
    caption.textContent = '📖 Perhatikan ustadz. Dengarkan instruksi cara membaca jilid dan cara merekam bacaan.';
    caption.classList.add('show');
  } else if (i === 2) {
    caption.textContent = '🔎 Fokus ke jilid. Bacalah contoh dengan teliti sesuai penjelasan ustadz.';
    caption.classList.add('show');
  }

  if (i === 0) {
    scene.classList.remove('focus');
    ustad.classList.remove('instruction');
    ustadzah.classList.remove('instruction');
    boardHint.classList.remove('show');
    status.textContent = 'Ustadz: salam dan sapaan';
  } else if (i === 1) {
    ustad.classList.add('instruction');
    ustadzah.classList.add('instruction');
    status.textContent = 'Ustadz: memberikan instruksi';
  } else if (i === 2) {
    scene.classList.add('focus');
    boardHint.classList.add('show');
    status.textContent = 'Materi: mim bertemu mim bertasydid';
  } else if (i === 3) {
    scene.classList.remove('focus');
    boardHint.classList.remove('show');
    ustad.classList.remove('instruction');
    ustadzah.classList.remove('instruction');
    status.textContent = 'Ustadz: motivasi dan penutup';
  }

  try {
    await audios[i].play();
  } catch(err) {
    status.textContent = 'Tekan Mulai Belajar untuk mengaktifkan suara.';
    setSpeaking(false);
    console.warn(err);
  }
}

audios.forEach((audio, i) => {
  audio.addEventListener('ended', () => {
    if (i === index) startAudio(i + 1);
  });
});

function finishLesson() {
  setSpeaking(false);
  caption.classList.remove('show');
  status.textContent = 'Sekarang giliran siswa';
  afterLesson.classList.add('show');
  scene.classList.remove('focus');
  greeting.classList.add('show');
}

touchCard.addEventListener('click', () => {
  afterLesson.classList.add('zoomed');
  recordMsg.textContent = 'Ketuk mikrofon untuk merekam';
});

recordBtn.addEventListener('click', async () => {
  if (recorder && recorder.state === 'recording') {
    recorder.stop();
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    recordMsg.textContent = 'Browser ini tidak mendukung perekaman suara.';
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstart = () => {
      recordBtn.classList.add('recording');
      recordBtn.textContent = '⏹️';
      recordMsg.textContent = 'Sedang merekam... ketuk lagi untuk berhenti.';
    };
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, {type:'audio/webm'});
      const url = URL.createObjectURL(blob);
      recordedAudio.src = url;
      recordedAudio.style.display = 'block';
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '🎙️';
      recordMsg.textContent = 'Rekaman selesai. Silakan dengarkan hasilnya.';
    };
    recorder.start();
  } catch(err) {
    recordMsg.textContent = 'Izin mikrofon belum diberikan.';
    console.error(err);
  }
});

// Hook tahap berikutnya: sengaja tidak dipanggil otomatis.
async function kirimDataSiswa(nama, linkAudio) {
  const endpoint = 'https://script.google.com/macros/s/AKfycbz8TWEnHNhHR7RG4HAb72raYQ8u63bZHEMNSaFwfvs6vgve1-0PSO5NDAoQiMmtWnUSJg/exec';
  return fetch(endpoint, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({nama:nama, audio:linkAudio, timestamp:new Date().toISOString()})
  });
}
