<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tahsin Al-Qur'an Interaktif</title>
<style>
:root {
  --ink:#17324d; --gold:#d5a84c; --cream:#fffaf0;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#18212b;color:var(--ink)}
button,input{font:inherit}
button{cursor:pointer;border:0}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#d9d2c5}
#room{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#dcebdc 0 58%,#e7d0ae 58% 100%);transition:transform 1.25s cubic-bezier(.2,.8,.2,1),filter 1s ease}
/* Ruang kelas kosong: hanya dinding, papan, lantai. Tidak ada bangku/meja siswa. */
#room::before{content:"";position:absolute;left:5%;right:5%;top:17%;height:47%;border:14px solid #76583d;border-radius:10px;background:linear-gradient(145deg,#527a62,#294d3b);box-shadow:inset 0 0 0 7px rgba(255,255,255,.10),0 18px 35px rgba(0,0,0,.22)}
#room::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(165deg,transparent 0 15%,rgba(137,91,48,.16) 15.2% 16%,transparent 16.2%),linear-gradient(180deg,#d9b98d,#b58b61);pointer-events:none}
#nameOverlay{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(14,25,37,.45);backdrop-filter:blur(7px);transition:opacity .7s ease,visibility .7s}
#nameOverlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.nameCard{width:min(90vw,480px);padding:28px;border-radius:24px;background:rgba(255,255,255,.96);box-shadow:0 20px 60px rgba(0,0,0,.28);text-align:center}
.nameCard h1{margin:0 0 10px;font-size:clamp(1.4rem,5vw,2.2rem)}
.nameCard p{margin:0 0 18px;color:#5b6670}
.nameCard input{width:100%;padding:15px 16px;border:2px solid #dfe4e8;border-radius:14px;outline:none}
.nameCard input:focus{border-color:#6d9fca}
.start{margin-top:14px;width:100%;padding:15px;border-radius:14px;background:#1d6f8c;color:white;font-weight:800}
.start:disabled{opacity:.4;cursor:not-allowed}
#greeting{position:absolute;top:5%;left:50%;transform:translateX(-50%);z-index:20;width:min(90vw,800px);text-align:center;color:#fff;font-weight:800;font-size:clamp(1rem,2.8vw,2rem);text-shadow:0 3px 10px rgba(0,0,0,.75);opacity:0;transition:opacity .8s}
#greeting.show{opacity:1}
#scene{position:absolute;inset:0;z-index:10;transform-origin:50% 43%;transition:transform 1.25s cubic-bezier(.2,.8,.2,1)}
#scene.focus{transform:scale(1.62) translateY(7%)}
#teachers{position:absolute;inset:0;pointer-events:none;z-index:4}
.teacher{position:absolute;bottom:1%;height:min(72vh,750px);width:auto;object-fit:contain;filter:drop-shadow(0 16px 12px rgba(0,0,0,.24));transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .8s,filter .5s}
#ustadzah{left:-2%;bottom:5%;height:min(61vh,650px);transform-origin:bottom center;z-index:3;opacity:.72}
#ustad{right:-1%;bottom:0;height:min(78vh,820px);transform-origin:bottom center;z-index:6}
.teacher.speaking{animation:breathe .9s ease-in-out infinite alternate;filter:drop-shadow(0 12px 12px rgba(0,0,0,.28)) drop-shadow(0 0 12px rgba(255,226,120,.7))}
#ustad.instruction{transform:translateX(-18%) rotate(-1deg)}
#ustadzah.instruction{transform:translateX(5%)}
#scene.focus #ustadzah{transform:translateX(-20%) scale(.72);opacity:.25}
#scene.focus #ustad{transform:translateX(18%) scale(.72);opacity:.22}
#boardMaterial{position:absolute;left:50%;top:39%;width:min(22vw,300px);transform:translate(-50%,-50%);z-index:5;opacity:1;transition:transform 1.15s cubic-bezier(.2,.8,.2,1),opacity .8s,box-shadow .8s;box-shadow:0 3px 12px rgba(0,0,0,.20);border:5px solid #6e5235;border-radius:4px;overflow:hidden;background:#fff}
/* efek seolah jilid benar-benar menempel di papan */
#boardMaterial::before{content:"Jilid 3 • Bacaan mim yang ditahan dengungnya";position:absolute;left:5%;right:5%;bottom:3%;z-index:2;text-align:center;font-weight:900;font-size:clamp(7px,1.1vw,14px);color:#4c321c;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.8);box-shadow:none;opacity:.0;transition:opacity .4s}.focus #boardMaterial::before{opacity:1}
#boardMaterial img{display:block;width:100%;height:auto}#boardTitle{text-align:center;font-weight:900;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;color:#fff;margin-top:6px;display:none}
#scene.focus #boardMaterial{transform:translate(-50%,-50%) scale(1.9);opacity:1;box-shadow:0 20px 55px rgba(0,0,0,.42)}
#boardHint{position:absolute;left:50%;top:67%;transform:translateX(-50%);z-index:15;color:#fff;background:rgba(16,29,39,.82);padding:10px 16px;border-radius:999px;font-size:clamp(.78rem,2vw,1rem);opacity:0;transition:opacity .6s;white-space:nowrap}
#boardHint.show{opacity:1}
#caption{position:absolute;left:50%;top:76%;transform:translateX(-50%);z-index:30;width:min(88vw,620px);padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 12px 30px rgba(0,0,0,.20);font-size:clamp(.82rem,2.4vw,1rem);line-height:1.4;text-align:center;opacity:0;transition:opacity .5s}
#caption.show{opacity:1}
#status{position:absolute;top:12px;right:12px;z-index:40;background:rgba(20,35,48,.78);color:#fff;padding:8px 12px;border-radius:999px;font-size:.78rem}
#afterLesson{position:absolute;inset:0;z-index:35;display:none;pointer-events:none}
#afterLesson.show{display:block}
#touchCard{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(30vw,340px);min-width:180px;padding:0;background:transparent;border:0;border-radius:10px;box-shadow:none;pointer-events:auto;transition:transform .85s cubic-bezier(.2,.8,.2,1),filter .7s}
#touchCard img{border:5px solid #6e5235;border-radius:6px;box-shadow:0 10px 28px rgba(0,0,0,.30);background:#fff}
#touchCard img{display:block;width:100%;height:auto}
#touchLabel{position:absolute;left:50%;top:-54px;transform:translateX(-50%);text-align:center;font-weight:900;color:#fff;background:rgba(20,35,48,.86);padding:10px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.22)}
#afterLesson.zoomed #touchCard{top:50%;width:min(92vw,900px);transform:translate(-50%,-50%);filter:drop-shadow(0 20px 45px rgba(0,0,0,.35))}
#afterLesson.zoomed #touchCard img{border-width:6px}
#afterLesson.zoomed #touchLabel{top:-48px;background:rgba(29,111,140,.94)}
#recordBox{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;pointer-events:auto;opacity:0;transition:opacity .5s}
#afterLesson.zoomed #recordBox{opacity:1}
#recordBtn{width:68px;height:68px;border-radius:50%;background:#c83b3b;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.3);font-size:29px}
#recordBtn.recording{background:#1c7d54;animation:pulse 1s infinite}
#recordMsg{background:#fff;padding:10px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:700}
#recordedAudio{display:none;position:absolute;left:50%;bottom:1.5%;transform:translateX(-50%);z-index:40;width:min(92vw,520px)}
#nextBtn{display:none;position:absolute;right:16px;bottom:16px;z-index:40;padding:12px 18px;border-radius:12px;background:#1d6f8c;color:#fff;font-weight:800}
@keyframes breathe{from{transform:translateY(0) scale(1)}to{transform:translateY(-6px) scale(1.012)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(28,125,84,.35)}50%{box-shadow:0 0 0 15px rgba(28,125,84,0)}}
@media(max-width:700px){
  .teacher{bottom:2%}
  #ustadzah{left:-14%;bottom:8%;height:50vh;opacity:.62}
  #ustad{right:-12%;bottom:0;height:66vh}
  #boardMaterial{width:25vw;top:39%}
  #scene.focus{transform:scale(1.95) translateY(9%)}
  #boardHint{top:72%}
  #touchCard{width:52vw} #afterLesson.zoomed #touchCard{width:92vw} #touchLabel{top:-50px;font-size:.85rem}
}
</style>
</head>
<body>
<div id="app">
  <div id="room"></div>
  <div id="scene">
    <div id="greeting"></div>
    <div id="teachers">
      <img id="ustadzah" class="teacher" src="ustadzah_transparan.png" alt="Ustadzah">
      <img id="ustad" class="teacher" src="ustad_transparan.png" alt="Ustadz">
    </div>
    <div id="boardMaterial"><img src="materi_jilid.jpg" alt="Materi IWR Jilid 3 halaman 2"></div>
    <div id="boardHint">Perhatikan materi di papan tulis.</div>
    <div id="caption"></div>
  </div>

  <div id="status">Siap belajar</div>

  <div id="nameOverlay">
    <form class="nameCard" id="nameForm">
      <h1>Tahsin Al-Qur'an</h1>
      <p>Masukkan nama lengkap siswa untuk memulai pembelajaran.</p>
      <input id="studentName" autocomplete="name" placeholder="Nama Lengkap Siswa" minlength="3" required>
      <button class="start" id="startBtn" disabled>Mulai Belajar</button>
    </form>
  </div>

  <div id="afterLesson">
    <div id="touchCard" title="Sentuh materi untuk mendekat">
      <img src="materi_jilid.jpg" alt="Sentuh materi">
      <div id="touchLabel">👆 Klik untuk membaca jilid</div>
    </div>
    <div id="recordBox">
      <button id="recordBtn" aria-label="Mulai merekam">🎙️</button>
      <div id="recordMsg">Ketuk mikrofon untuk merekam</div>
    </div>
  </div>

  <audio id="a1" preload="auto" src="audio_1_salam.m4a"></audio>
  <audio id="a2" preload="auto" src="audio_2_instruksi.m4a"></audio>
  <audio id="a3" preload="auto" src="audio_3_materi.m4a"></audio>
  <audio id="a4" preload="auto" src="audio_4_penutup.m4a"></audio>
  <audio id="recordedAudio" controls></audio>
</div>

<script>
const audios = [
  document.getElementById('a1'),
  document.getElementById('a2'),
  document.getElementById('a3'),
  document.getElementById('a4')
];

const captions = [
  "Assalamu'alaikum. Selamat datang, anak-anak. Semoga hari ini kita belajar membaca Al-Qur'an dengan semangat, teliti, dan penuh perhatian.",
  "Sekarang perhatikan ustadz. Dengarkan instruksi dengan baik, lalu ikuti langkah yang ustadz tunjukkan.",
  "Materi kita adalah bacaan mim yang ditahan dengungnya. Ketika huruf mim bertemu mim bertasydid, bacaannya ditahan dengan dengung.",
  "Alhamdulillah, pembelajaran hari ini selesai. Terus semangat belajar, ulangi latihan dengan baik, dan jangan lupa membaca Al-Qur'an setiap hari."
];

const nameOverlay = document.getElementById('nameOverlay');
const nameForm = document.getElementById('nameForm');
const studentName = document.getElementById('studentName');
const startBtn = document.getElementById('startBtn');
const scene = document.getElementById('scene');
const greeting = document.getElementById('greeting');
const caption = document.getElementById('caption');
const status = document.getElementById('status');
const ustad = document.getElementById('ustad');
const ustadzah = document.getElementById('ustadzah');
const boardHint = document.getElementById('boardHint');
const afterLesson = document.getElementById('afterLesson');
const touchCard = document.getElementById('touchCard');
const recordBtn = document.getElementById('recordBtn');
const recordMsg = document.getElementById('recordMsg');
const recordedAudio = document.getElementById('recordedAudio');

let index = 0;
let namaSiswa = '';
let recorder = null;
let chunks = [];

studentName.addEventListener('input', () => {
  startBtn.disabled = studentName.value.trim().length < 3;
});

nameForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  namaSiswa = studentName.value.trim();
  nameOverlay.classList.add('hidden');
  greeting.textContent = `Selamat belajar, ${namaSiswa}!`;
  setTimeout(() => greeting.classList.add('show'), 450);
  status.textContent = 'Pembukaan';
  await startAudio(0);
});

function setSpeaking(on) {
  ustad.classList.toggle('speaking', on);
}

async function startAudio(i) {
  index = i;
  if (i >= audios.length) {
    finishLesson();
    return;
  }

  audios.forEach((a,j) => {
    if (j !== i) { a.pause(); a.currentTime = 0; }
    a.volume = 1.0;
  });

  setSpeaking(true);
  caption.classList.remove('show');
  if (i === 1) {
    caption.textContent = '📖 Dengarkan cara membaca jilid. Setelah paham, siapkan bacaan dan gunakan mikrofon untuk merekam suara.';
    caption.classList.add('show');
  } else if (i === 2) {
    caption.textContent = '🔎 Perhatikan contoh pada jilid. Baca dengan teliti sesuai penjelasan ustadz.';
    caption.classList.add('show');
  }

  if (i === 0) {
    scene.classList.remove('focus');
    ustad.classList.remove('instruction');
    ustadzah.classList.remove('instruction');
    boardHint.classList.remove('show');
    status.textContent = 'Ustadz: salam dan sapaan';
  } else if (i === 1) {
    ustad.classList.add('instruction');
    ustadzah.classList.add('instruction');
    status.textContent = 'Ustadz: memberikan instruksi';
  } else if (i === 2) {
    scene.classList.add('focus');
    boardHint.classList.add('show');
    status.textContent = 'Materi: mim bertemu mim bertasydid';
  } else if (i === 3) {
    scene.classList.remove('focus');
    boardHint.classList.remove('show');
    ustad.classList.remove('instruction');
    ustadzah.classList.remove('instruction');
    status.textContent = 'Ustadz: motivasi dan penutup';
  }

  try {
    await audios[i].play();
  } catch(err) {
    status.textContent = 'Tekan Mulai Belajar untuk mengaktifkan suara.';
    setSpeaking(false);
    console.warn(err);
  }
}

audios.forEach((audio, i) => {
  audio.addEventListener('ended', () => {
    if (i === index) startAudio(i + 1);
  });
});

function finishLesson() {
  setSpeaking(false);
  caption.classList.remove('show');
  status.textContent = 'Sekarang giliran siswa';
  afterLesson.classList.add('show');
  scene.classList.remove('focus');
  greeting.classList.add('show');
}

touchCard.addEventListener('click', () => {
  afterLesson.classList.add('zoomed');
  recordMsg.textContent = 'Ketuk mikrofon untuk merekam';
});

recordBtn.addEventListener('click', async () => {
  if (recorder && recorder.state === 'recording') {
    recorder.stop();
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    recordMsg.textContent = 'Browser ini tidak mendukung perekaman suara.';
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstart = () => {
      recordBtn.classList.add('recording');
      recordBtn.textContent = '⏹️';
      recordMsg.textContent = 'Sedang merekam... ketuk lagi untuk berhenti.';
    };
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, {type:'audio/webm'});
      const url = URL.createObjectURL(blob);
      recordedAudio.src = url;
      recordedAudio.style.display = 'block';
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '🎙️';
      recordMsg.textContent = 'Rekaman selesai. Silakan dengarkan hasilnya.';
    };
    recorder.start();
  } catch(err) {
    recordMsg.textContent = 'Izin mikrofon belum diberikan.';
    console.error(err);
  }
});

// Hook tahap berikutnya: sengaja tidak dipanggil otomatis.
async function kirimDataSiswa(nama, linkAudio) {
  const endpoint = 'https://script.google.com/macros/s/AKfycbz8TWEnHNhHR7RG4HAb72raYQ8u63bZHEMNSaFwfvs6vgve1-0PSO5NDAoQiMmtWnUSJg/exec';
  return fetch(endpoint, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({nama:nama, audio:linkAudio, timestamp:new Date().toISOString()})
  });
}
</script>
</body>
</html>
